<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spend Wise Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-shell">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">

            <h2 class="logo">Spend Wise</h2>

            <nav class="sidebar-nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Transactions</a>
                <a href="#">Categories</a>
                <a href="#">Savings</a>
                <a href="#">Reports</a>
            </nav>

        </aside>


        <!-- Main Dashboard -->
        <main class="main-content">

            <!-- Dashboard Header -->
            <header class="dashboard-header">

                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome to your financial overview.</p>
                </div>

                <div class="user-info">
                    <span>My Account</span>
                </div>

            </header>


            <!-- Expense Form -->
            <section class="expense-form-section">

                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <label for="expenseName">Expense Name</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="e.g. Food"
                        required
                    >

                    <label for="expenseAmount">Amount</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="e.g. 500"
                        required
                    >

                    <button type="submit">Add Expense</button>

                </form>

            </section>


            <!-- Budget Summary -->
            <section class="budget-summary">

                <h2>Budget Summary</h2>

                <p>Total Expenses:
                    <strong id="totalExpenses">KES 0</strong>
                </p>

                <p>Remaining Balance:
                    <strong id="remainingBalance">KES 0</strong>
                </p>

                <p id="budgetMessage">
                    Add an expense to see your budget status.
                </p>

            </section>


            <!-- Expense Records -->
            <section class="expenses-section">

                <h2>Expense Records</h2>

                <div id="expenseList">
                    <p>No expenses added yet.</p>
                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
